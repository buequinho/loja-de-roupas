<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja de Roupas</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Loja de Roupas</h1>
    <p>Frontend + Backend integrados em um projeto completo.</p>
  </header>

  <main>
    <section>
      <h2>Produtos</h2>
      <div id="products" class="grid"></div>
    </section>

    <section>
      <h2>Carrinho</h2>
      <div id="cart"></div>
      <button id="checkout">Finalizar pedido</button>
      <p id="orderStatus"></p>
    </section>

    <section>
      <h2>Pedidos</h2>
      <ul id="orders"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
