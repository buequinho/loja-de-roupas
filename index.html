<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Produtos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .container {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
        display: grid;
        gap: 1rem;
      }

      .card {
        background: #ffffff;
        border-radius: 0.75rem;
        padding: 1.25rem;
        box-shadow: 0 8px 24px rgba(17, 24, 39, 0.06);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .subtitle {
        margin-top: 0.5rem;
        color: #4b5563;
      }

      .product-form {
        margin-top: 1rem;
        display: grid;
        gap: 0.75rem;
      }

      .grid-two {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }

      label {
        font-weight: 600;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        margin-top: 0.35rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        padding: 0.6rem 0.7rem;
        font-size: 0.95rem;
      }

      input:focus {
        outline: 2px solid #2563eb;
        border-color: #2563eb;
      }

      .actions {
        margin-top: 0.25rem;
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 0.5rem;
        padding: 0.65rem 0.9rem;
        font-weight: 600;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
      }

      button.secondary {
        background: #6b7280;
      }

      button.danger {
        background: #dc2626;
      }

      button.icon {
        font-size: 0.8rem;
        padding: 0.45rem 0.65rem;
      }

      .hidden {
        display: none;
      }

      .table-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }

      .table-wrapper {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        text-align: left;
        padding: 0.7rem;
        border-bottom: 1px solid #e5e7eb;
      }

      .empty-state {
        text-align: center;
        color: #6b7280;
        padding: 1rem;
      }

      .actions-cell {
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Cadastro de produtos</h1>
        <p class="subtitle">Adicione, edite e remova produtos diretamente pelo dashboard.</p>

        <form id="product-form" class="product-form">
          <input type="hidden" id="product-id" />

          <label for="name">Nome do produto</label>
          <input id="name" name="name" type="text" placeholder="Ex.: Camiseta básica" required />

          <div class="grid-two">
            <div>
              <label for="price">Preço (R$)</label>
              <input id="price" name="price" type="number" min="0" step="0.01" placeholder="99.90" required />
            </div>

            <div>
              <label for="stock">Estoque</label>
              <input id="stock" name="stock" type="number" min="0" step="1" placeholder="10" required />
            </div>
          </div>

          <label for="category">Categoria</label>
          <input id="category" name="category" type="text" placeholder="Ex.: Masculino" required />

          <div class="actions">
            <button type="submit" id="submit-button">Cadastrar produto</button>
            <button type="button" id="cancel-edit" class="secondary hidden">Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="table-header">
          <h2>Produtos cadastrados</h2>
          <span id="product-count">0 produtos</span>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="product-list"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="empty-state-template">
      <tr>
        <td colspan="5" class="empty-state">Nenhum produto cadastrado ainda.</td>
      </tr>
    </template>

    <script>
      const STORAGE_KEY = "dashboard-products";

      const form = document.querySelector("#product-form");
      const idInput = document.querySelector("#product-id");
      const nameInput = document.querySelector("#name");
      const priceInput = document.querySelector("#price");
      const stockInput = document.querySelector("#stock");
      const categoryInput = document.querySelector("#category");
      const submitButton = document.querySelector("#submit-button");
      const cancelEditButton = document.querySelector("#cancel-edit");
      const productList = document.querySelector("#product-list");
      const productCount = document.querySelector("#product-count");
      const emptyStateTemplate = document.querySelector("#empty-state-template");

      let products = loadProducts();

      renderProducts();

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const product = readFormData();
        if (!product) {
          return;
        }

        if (idInput.value) {
          products = products.map((item) => (item.id === idInput.value ? { ...item, ...product } : item));
        } else {
          products.push({
            id: crypto.randomUUID(),
            ...product,
          });
        }

        saveProducts(products);
        renderProducts();
        resetForm();
      });

      cancelEditButton.addEventListener("click", resetForm);

      function readFormData() {
        const name = nameInput.value.trim();
        const category = categoryInput.value.trim();
        const price = Number(priceInput.value);
        const stock = Number(stockInput.value);

        if (!name || !category || Number.isNaN(price) || Number.isNaN(stock) || price < 0 || stock < 0) {
          alert("Preencha todos os campos com valores válidos.");
          return null;
        }

        return { name, category, price, stock };
      }

      function renderProducts() {
        productList.innerHTML = "";

        if (products.length === 0) {
          productList.append(emptyStateTemplate.content.cloneNode(true));
          updateCounter();
          return;
        }

        products.forEach((product) => {
          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${product.name}</td>
            <td>${product.category}</td>
            <td>${formatCurrency(product.price)}</td>
            <td>${product.stock}</td>
            <td class="actions-cell">
              <button class="icon" data-action="edit" data-id="${product.id}">Editar</button>
              <button class="icon danger" data-action="delete" data-id="${product.id}">Excluir</button>
            </td>
          `;

          productList.append(row);
        });

        updateCounter();
      }

      productList.addEventListener("click", (event) => {
        const target = event.target;

        if (!(target instanceof HTMLButtonElement)) {
          return;
        }

        const action = target.dataset.action;
        const productId = target.dataset.id;
        const selectedProduct = products.find((product) => product.id === productId);

        if (!selectedProduct) {
          return;
        }

        if (action === "edit") {
          idInput.value = selectedProduct.id;
          nameInput.value = selectedProduct.name;
          categoryInput.value = selectedProduct.category;
          priceInput.value = selectedProduct.price;
          stockInput.value = selectedProduct.stock;

          submitButton.textContent = "Salvar alterações";
          cancelEditButton.classList.remove("hidden");
          nameInput.focus();
        }

        if (action === "delete") {
          products = products.filter((product) => product.id !== productId);
          saveProducts(products);
          renderProducts();

          if (idInput.value === productId) {
            resetForm();
          }
        }
      });

      function resetForm() {
        form.reset();
        idInput.value = "";
        submitButton.textContent = "Cadastrar produto";
        cancelEditButton.classList.add("hidden");
      }

      function updateCounter() {
        const total = products.length;
        productCount.textContent = `${total} ${total === 1 ? "produto" : "produtos"}`;
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("pt-BR", {
          style: "currency",
          currency: "BRL",
        }).format(value);
      }

      function loadProducts() {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return [];
        }

        try {
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch {
          return [];
        }
      }

      function saveProducts(productData) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(productData));
      }
    </script>
  </body>
</html>
